version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # @astrojs/check 0.9.12 supports TypeScript 5/6, not the TypeScript 7 API.
    # Revisit this exclusion when the Astro checker supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions: ['7.x']
    groups:
      astro:
        patterns: [astro, '@astrojs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
